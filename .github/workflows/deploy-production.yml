name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag contained in main
        required: true
        default: main
        type: string
      version:
        description: New stable version (vMAJOR.MINOR.PATCH)
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy_sha: ${{ steps.release.outputs.deploy_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Checkout selected release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a new stable release from main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main
          DEPLOY_SHA="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "Selected ref must resolve to a commit contained in main."
            exit 1
          fi

          if ! printf '%s' "$RELEASE_VERSION" |
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Version must use stable semantic version format vMAJOR.MINOR.PATCH."
            exit 1
          fi

          if git rev-parse --quiet --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "Version tag $RELEASE_VERSION already exists."
            exit 1
          fi

          LATEST_VERSION="$(
            gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/releases" \
              -f per_page=100 \
              --jq '.[] |
                select(.draft == false and .prerelease == false) |
                .tag_name |
                select(test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' |
              sort -V |
              tail -n 1
          )"

          if [ -z "$LATEST_VERSION" ]; then
            if [ "$RELEASE_VERSION" != "v1.0.0" ]; then
              echo "The first stable production release must be v1.0.0."
              exit 1
            fi
          else
            RELEASE_VERSION="$RELEASE_VERSION" LATEST_VERSION="$LATEST_VERSION" node - <<'NODE'
          const parse = (value) => value.slice(1).split(".").map(Number);
          const candidate = parse(process.env.RELEASE_VERSION);
          const latest = parse(process.env.LATEST_VERSION);

          for (let index = 0; index < candidate.length; index += 1) {
            if (candidate[index] > latest[index]) process.exit(0);
            if (candidate[index] < latest[index]) break;
          }

          console.error(
            `Version ${process.env.RELEASE_VERSION} must be greater than ${process.env.LATEST_VERSION}.`,
          );
          process.exit(1);
          NODE
          fi

          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build
        env:
          CLOUDFLARE_ENV: production
        run: |
          pnpm build
          pnpm check:bundle

  deploy:
    name: Deploy production Worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
    steps:
      - name: Checkout verified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.deploy_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          CLOUDFLARE_ENV: production
        run: |
          pnpm build
          pnpm check:bundle

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ENV: production
        run: pnpm exec wrangler deploy

      - name: Verify deployment
        env:
          PRODUCTION_WORKER_ORIGIN: ${{ vars.PRODUCTION_WORKER_ORIGIN }}
        run: |
          node scripts/smoke-preview.mjs \
            "$PRODUCTION_WORKER_ORIGIN" \
            https://hyre-worker-nestjs-production.fly.dev \
            production

  release:
    name: Publish GitHub release
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create stable release
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.deploy_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$DEPLOY_SHA" \
            --generate-notes \
            --title "$RELEASE_VERSION"
